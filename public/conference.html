<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="style1.css">
  <title>Salle de Conférence</title>
</head>
<body>
  <header>
    <img src="images/logo.png" alt="Logo">
    <h1>Salle de Conférence</h1>
  </header>

  <div class="conference-layout">
    <div class="participants-list">
      <h2>Participants</h2>
      <ul class="list-group border p-2 mb-3">
        <!-- Les noms des participants seront ajoutés ici avec boutons d'action -->
      </ul>
    </div>

    <div class="main-content">
      <div class="video-container">
        <div id="video-grid"></div>
      </div>

      <div class="options-container">
        <button class="option-button" id="shareScreen">
            <i class="fas fa-share"></i> <!-- Icône pour "Partager l'écran" -->
        </button>
        <button class="option-button" id="inviteParticipant">
            <i class="fas fa-user-plus"></i> <!-- Icône pour "Inviter un participant" -->
        </button>
      </div>
    </div>

    <!-- Chat à droite -->
    <div class="chat-container">
      <h2>Chat</h2>
      <div id="chat-box">
        <!-- Les messages du chat seront ajoutés ici -->
      </div>
      <form id="chat-form">
        <input type="text" id="chat-input" class="chat-input" placeholder="Tapez un message..." autocomplete="on">
        <button type="submit" class="btn btn-primary">Envoyer</button>
      </form>
    </div>
  </div>

  <footer>
    <div class="options-container">
      <button id="muteButton"> </button>
      <button id="videoButton"></button>
      
      <button id="endCallButton">
          <i class="fas fa-phone-slash"></i> <!-- Icône pour "Terminer l'appel" -->
      </button>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://unpkg.com/peerjs@1.3.1/dist/peerjs.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
