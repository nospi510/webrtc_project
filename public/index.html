<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <title>Application de Visioconférence</title>
  
</head>
<body>
  <header>
    <img src="images/logo.png" alt="Logo">
    <h1>Application de Visioconférence</h1>

  </header>

  <main>
    <h2 id="welcomeMessage"></h2> <!-- Ajouté pour le message de bienvenue -->

    <h1>Créer une Salle de Conférence</h1>
    <form id="createRoomForm">
      <input type="text" id="roomName" placeholder="Nom de la salle" required>
      <button type="submit">Créer la Salle</button>
    </form>

    <h1>Rejoindre une Salle de Conférence</h1>
    <form id="joinRoomForm">
      <input type="text" id="roomCode" placeholder="Code de la salle" required>
      <button type="submit">Rejoindre la Salle</button>
    </form>
  </main>

  <!-- Scripts -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://unpkg.com/peerjs@1.3.1/dist/peerjs.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
